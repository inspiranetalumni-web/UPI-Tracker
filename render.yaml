services:
  - type: web
    name: upi-tracker-backend
    env: docker
    region: oregon
    rootDir: backend
    plan: free # Can be upgraded to starter/standard in production
    healthCheckPath: /api/health # Assuming you add a basic health check controller
    envVars:
      - key: PORT
        value: 8080
      # Add Firebase Admin SDK credentials in the Render dashboard:
      # - GOOGLE_APPLICATION_CREDENTIALS (JSON content)
