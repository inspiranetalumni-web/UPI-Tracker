name: upi_tracker
description: UPI Expense Tracker with auto-notification capture
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.3.1
  fl_chart: ^1.2.0
  intl: ^0.20.3
  fluttertoast: ^10.0.0
  permission_handler: ^11.3.1
  google_fonts: ^8.2.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  flutter_dotenv: ^5.1.0
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - .env

